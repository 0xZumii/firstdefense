<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Defense  -  key check</title>
<style>
  body{margin:0;background:#f7f5f1;color:#12161c;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;font-size:16px}
  .wrap{max-width:760px;margin:0 auto;padding:36px 20px 80px}
  h1{font-size:1.4rem;margin:0 0 4px}
  p.note{color:#4a5560;margin:0 0 20px;font-size:.94rem}
  .card{background:#fff;border:1px solid #e2ded6;border-radius:12px;padding:18px 20px;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:.86rem;margin-bottom:6px}
  input{width:100%;font:inherit;border:1.5px solid #e2ded6;border-radius:8px;padding:10px 12px;background:#fdfcfb}
  button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:8px;padding:11px 18px;background:#2b4a7a;color:#fff;margin-top:10px}
  pre{background:#fbf9f5;border:1px solid #e2ded6;border-radius:8px;padding:14px;overflow-x:auto;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-word}
  .status{font-weight:700;margin:0 0 10px}
  .ok{color:#2f6f5e}.err{color:#9a3b34}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gemini key check</h1>
  <p class="note">Calls no model. Just asks Google "which models can this key see?"  -  so a bad key and a bad request can't be confused.</p>

  <div class="card">
    <label for="key">API key (from aistudio.google.com/apikey)</label>
    <input id="key" type="password" placeholder="paste key here" autocomplete="off">
    <button id="go">Check key</button>
  </div>

  <div class="card">
    <p id="status" class="status">Idle.</p>
    <pre id="out">Result appears here.</pre>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const show=o=>$('out').textContent=typeof o==='string'?o:JSON.stringify(o,null,2);

async function direct(url){
  const res=await fetch(url,{method:'GET'});
  const body=await res.text();
  let parsed=null; try{parsed=JSON.parse(body)}catch{}
  return{status:res.status,ok:res.ok,body,parsed};
}

$('go').onclick=async()=>{
  const key=($('key').value||'').trim();
  if(!key){$('status').textContent='Paste a key first.';$('status').className='status err';return;}
  $('status').textContent='Checking with Google...';
  $('status').className='status';
  show('...');

  const report={keyLength:key.length,startsWithAIza:key.startsWith('AIza'),hasWhitespace:/\s/.test(key),attempts:[]};

  // Attempt 1: the documented v1beta models list
  try{
    const a=await direct('https://generativelanguage.googleapis.com/v1beta/models?key='+encodeURIComponent(key));
    report.attempts.push({url:'v1beta/models',httpStatus:a.status});
    if(a.ok){
      const names=(a.parsed&&a.parsed.models?a.parsed.models:[]).map(m=>m.name);
      report.VERDICT='KEY IS VALID  -  it can list models.';
      report.modelsVisible=names.slice(0,40);
      report.hasGemini38Flash=names.some(n=>n.includes('gemini-3.8-flash'));
      $('status').textContent='Key is valid ?';
      $('status').className='status ok';
      show(report);return;
    }
    report.attempts[0].error=a.parsed&&a.parsed.error?a.parsed.error.message:a.body;
  }catch(e){report.attempts[0].error='fetch threw: '+e.message;}

  // Attempt 2: v1
  try{
    const b=await direct('https://generativelanguage.googleapis.com/v1/models?key='+encodeURIComponent(key));
    report.attempts.push({url:'v1/models',httpStatus:b.status});
    if(b.ok){
      report.VERDICT='KEY IS VALID on v1  -  it can list models.';
      $('status').textContent='Key is valid ? (v1)';
      $('status').className='status ok';
      show(report);return;
    }
    report.attempts[1].error=b.parsed&&b.parsed.error?b.parsed.error.message:b.body;
  }catch(e){report.attempts[1].error='fetch threw: '+e.message;}

  report.VERDICT='KEY REJECTED by Google on both v1beta and v1.';
  report.likelyCause=!key.startsWith('AIza')
    ? 'Key does not start with "AIza"  -  this does not look like a Gemini API key. Keys from Google Cloud, Maps, or Firebase will not work here.'
    : 'Looks like a Gemini key shape, but Google rejects it: possible restrictions (HTTP referrer / API restrictions), a revoked or expired key, or a typo. Try generating a fresh key at aistudio.google.com/apikey.';
  $('status').textContent='Key rejected ?';
  $('status').className='status err';
  show(report);
};
</script>
</body>
</html>
